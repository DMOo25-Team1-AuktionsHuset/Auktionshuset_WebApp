name: .NET

on:
  push:
    branches:
      - main
      - Service/VaultImplementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      RUN_SONAR: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Service/VaultImplementation') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      HEADSCALE_URL: ${{ vars.HEADSCALE_URL }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          
      - name: Show workflow context
        shell: bash
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "RUN_SONAR: $RUN_SONAR"
          
      - name: Check Headscale availability
        if: env.RUN_SONAR == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            "${HEADSCALE_URL%/}/health"
            
      - name: Connect to Headscale
        if: env.RUN_SONAR == 'true'
        uses: tailscale/github-action@v4
        timeout-minutes: 3
        with:
          authkey: ${{ secrets.HEADSCALE_AUTH_KEY }}
          version: latest
          args: --login-server=${{ vars.HEADSCALE_URL }} --accept-dns=false

      - name: Disable subnet routes
        if: env.RUN_SONAR == 'true'
        shell: bash
        run: sudo tailscale set --accept-routes=false
        
      - name: Check SonarQube connectivity
        if: env.RUN_SONAR == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            "${SONAR_HOST_URL%/}/api/system/status"

      - name: Get SonarQube token from Vault
        if: env.RUN_SONAR == 'true'
        id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          caCertificate: ${{ vars.VAULT_CA_CERT_BASE64 }}
          method: jwt
          path: github-sonarqube
          role: sonarqube-ci
          jwtGithubAudience: https://github.com/DMOo25-Team1-AuktionsHuset
          exportEnv: false
          exportToken: false
          secrets: |
            auction/data/development/sonarqube/analysis token | SONAR_TOKEN ;

      - name: Install SonarQube scanner
        if: env.RUN_SONAR == 'true'
        shell: bash
        run: |
          dotnet tool install dotnet-sonarscanner \
            --version 12.0.0 \
            --tool-path "$RUNNER_TEMP/sonar-scanner"

      - name: Restore solution
        run: dotnet restore AuktionsHuset_WebApp.slnx

      - name: Check SonarQube authentication
        if: env.RUN_SONAR == 'true'
        shell: bash
        env:
          SONAR_TOKEN: ${{ steps.vault.outputs.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::SONAR_HOST_URL mangler."
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN fra Vault mangler."
            exit 1
          fi

          if [[ "$SONAR_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::Tokenet indeholder mellemrum eller linjeskift. Kontrollér værdien i Vault."
            exit 1
          fi

          curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --user "$SONAR_TOKEN:" \
            --write-out '\nHTTP-status: %{http_code}\n' \
            "${SONAR_HOST_URL%/}/api/authentication/validate"

      - name: Begin SonarQube analysis
        if: env.RUN_SONAR == 'true'
        id: sonar_begin
        shell: bash
        env:
          SONAR_TOKEN: ${{ steps.vault.outputs.SONAR_TOKEN }}
        run: |
          "$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" begin \
            /k:"auktionshuset-webapp" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Build entire solution
        id: build
        run: >
          dotnet build AuktionsHuset_WebApp.slnx
          --configuration Release
          --no-restore
          --no-incremental
          --disable-build-servers

      - name: Run all tests
        run: >
          dotnet test AuktionsHuset_WebApp.slnx
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=Integration"
          --verbosity normal

      - name: End SonarQube analysis
        if: ${{ !cancelled() && env.RUN_SONAR == 'true' && steps.sonar_begin.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ steps.vault.outputs.SONAR_TOKEN }}
        run: |
          "$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" end \
            /d:sonar.token="$SONAR_TOKEN"
