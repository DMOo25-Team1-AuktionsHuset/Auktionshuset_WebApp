$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{email}}","password":"intentionally-wrong-password"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 429', () => pm.response.to.have.status(429));
    language: text/javascript
order: 6000
